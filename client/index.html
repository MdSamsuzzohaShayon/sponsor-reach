<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sponsor Reach</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="mb-4 text-center">UK Skilled Worker Sponsors</h1>

    <div class="table-responsive">
      <table class="table table-hover table-bordered table-striped" id="sponsorTable">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Organisation Name</th>
            <th>Town/City</th>
            <th>County</th>
            <th>Type & Rating</th>
            <th>Route</th>
            <th>Email</th>
          </tr>
        </thead>
        <tbody id="sponsorBody">
          <!-- JS will insert rows here -->
        </tbody>
      </table>
    </div>

    <div class="text-center mt-4">
      <button class="btn btn-primary" id="loadMoreBtn">Load More</button>
    </div>
  </div>

  <script src="js/bootstrap.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
